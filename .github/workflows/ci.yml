# AEGIS-X PRIME CI.
# Hard rules: NO model weights are downloaded in CI (spec §6.12), and NO
# PyTorch is installed. Only the light pip set needed for lint/type/unit.
# Heavy-import tests carry the `heavy` marker and run locally instead.
# Diarization is covered here by fake worker interpreters (see
# tests/test_diarization_client.py) — pyannote is never installed in CI.

name: ci
on:
  push:
    branches: [feature/aegis-x-prime, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install light toolchain (no model weights, no torch)
        # Pinned to the versions recorded in requirements.lock.txt so CI
        # reproduces local results; unpinned numpy previously drifted to 2.x
        # and changed mypy stub strictness between local and CI.
        run: >
          pip install "pytest==9.1.1" "ruff==0.15.22" "mypy==2.3.0"
          "numpy==1.26.4" "PyYAML==6.0.3" "pydantic==2.13.4"
          "soundfile==0.12.1" "av==18.0.0" "scipy==1.13.1"
      - name: Assert CI installs no torch and no pyannote
        run: |
          ! pip show torch  > /dev/null 2>&1 || (echo "torch must not be in CI" && exit 1)
          ! pip show pyannote.audio > /dev/null 2>&1 || (echo "pyannote must not be in CI" && exit 1)
      - name: Lint (new code only)
        run: ruff check aegis tools tests pipeline/asr pipeline/contracts pipeline/ingest pipeline/diagnostics workers
      - name: Type check (new code only)
        run: mypy
      - name: Unit tests (light subset)
        run: pytest -m "not heavy" -q
      - name: Secret scan
        run: python tools/secret_scan.py

  release-gate:
    runs-on: ubuntu-latest
    continue-on-error: true   # expected to FAIL while the license decision is deferred;
                              # visible status keeps the block explicit (RELEASE_BLOCKED.md)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release gate (expected BLOCKED)
        run: python tools/release_gate.py
